name: Verify Reclaim
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reclaim
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: reclaim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: npm run build
      - name: Smoke-test the downloadable local build
        run: |
          python scripts/package_test_build.py
          unzip -q artifacts/raw/reclaim-local-test-build.zip -d /tmp/reclaim-build-check
          cd /tmp/reclaim-build-check/reclaim-local-test-build
          python run_local.py --setup-only
          SOCLAAS_API_KEY=ignored-local-test PAYPAL_CLIENT_ID=ignored-local-test PAYPAL_CLIENT_SECRET=ignored-local-test PAYMENT_MODE=sandbox python run_local.py --port 8010 --no-browser > /tmp/reclaim-launcher.log 2>&1 &
          reclaim_launcher_pid=$!
          trap 'kill -TERM "$reclaim_launcher_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8010/api/health > /tmp/reclaim-build-health.json; then break; fi
            sleep 1
          done
          python -c "import json; h=json.load(open('/tmp/reclaim-build-health.json')); assert h['status']=='ok' and h['payment_mode']=='demo' and h['ai_provider']=='demo-parser' and not h['paypal_configured']"
          curl -fsS http://127.0.0.1:8010/ | python -c "import sys; assert 'Reclaim' in sys.stdin.read()"
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://reclaim:test-only@localhost:5432/reclaim_test
      - name: Check the evaluation grader and offline benchmark
        run: |
          PYTHONPATH=backend python -m unittest discover -s evaluation/tests -q
          PYTHONPATH=backend python -m reclaim.evaluation --provider baseline --output /tmp/reclaim-evaluation.json
      - run: docker build -t reclaim-check .
      - name: Smoke-test the packaged application
        run: |
          docker run -d --name reclaim-check -p 8000:8000 reclaim-check
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | python -c "import sys; assert 'Reclaim' in sys.stdin.read()"
