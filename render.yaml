# Prepared paid plan: $7/month web + $6/month Postgres at the checked rates.
# Review credits, pricing, secrets and billing before applying this blueprint.
databases:
  - name: reclaim-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []

services:
  - type: web
    name: reclaim
    runtime: docker
    region: singapore
    branch: main
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reclaim-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PAYMENT_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SOCLAAS_API_KEY
        sync: false
      - key: SOCLAAS_BASE_URL
        value: https://soclaas-api.comp.nus.edu.sg/v1
      - key: SOCLAAS_MODEL
        value: default
      - key: AUTO_WORKER
        value: "true"
      - key: AUTH_MODE
        value: workspace
